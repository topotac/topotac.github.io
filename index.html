  // =========================================================
  // MARKED POINTS — persistent user-created waypoints
  // =========================================================
  const pointStorageKey = "topotac.markedPoints.v1";
  const addPointButton = document.getElementById("addPointButton");
  const clearPointsButton = document.getElementById("clearPointsButton");
  const enterCoordsButton = document.getElementById("enterCoordsButton");
  const pointEntryPanel = document.getElementById("pointEntryPanel");
  const pointFormat = document.getElementById("pointFormat");
  const pointLat = document.getElementById("pointLat");
  const pointLng = document.getElementById("pointLng");
  const pointName = document.getElementById("pointName");
  const pointEntryError = document.getElementById("pointEntryError");
  let pointPlacementActive = false;
  let suppressPointClicksUntil = 0;
  // blockDialogClickThrough: block dialog click through logic.
  function blockDialogClickThrough() { suppressPointClicksUntil = Date.now() + 650; }
  let markedPoints = [];
  let nextPointId = 1;
  const pointMarkers = new Map();

  // saveMarkedPoints: save marked points logic.
  function saveMarkedPoints() {
    try { localStorage.setItem(pointStorageKey, JSON.stringify({points:markedPoints,nextId:nextPointId})); }
    catch (err) { console.warn("Marked points could not be saved:", err); }
  }
  // pointPopup: point popup logic.
  function pointPopup(p) {
    const name = p.name ? "<strong>"+escapeHtml(p.name)+"</strong><br>" : "";
    return '<div style="min-width:190px;line-height:1.6">'+name+
      '<strong>Point '+p.id+'</strong><br>'+
      toDDM(Math.abs(p.lat))+(p.lat>=0?' N':' S')+', '+toDDM(Math.abs(p.lng))+(p.lng>=0?' E':' W')+'<br>'+
      p.lat.toFixed(6)+', '+p.lng.toFixed(6)+'<br>'+
      '<button type="button" data-point-action="copy" data-point-id="'+p.id+'">COPY</button> '+
      '<button type="button" data-point-action="rename" data-point-id="'+p.id+'">RENAME</button> '+
      '<button type="button" data-point-action="delete" data-point-id="'+p.id+'">DELETE POINT</button>'+
      '<br><small>Drag marker to move</small></div>';
  }
  // renderMarkedPoint: render marked point logic.
  function renderMarkedPoint(p) {
    const icon = L.divIcon({className:"",html:'<div class="marked-point-pin">'+p.id+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
    const marker = L.marker([p.lat,p.lng],{icon,draggable:true,bubblingMouseEvents:false});
    marker.bindPopup(pointPopup(p));
    marker.on("dragend", () => {
      const pos = marker.getLatLng();
      p.lat=pos.lat; p.lng=pos.lng;
      marker.setPopupContent(pointPopup(p));
      saveMarkedPoints();
    });
    pointMarkers.set(p.id,marker);
    markedPointsLayer.addLayer(marker);
    return marker;
  }
  // addMarkedPoint: add marked point logic.
  function addMarkedPoint(lat,lng,name="") {
    if (!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return;
    const p={id:nextPointId++,lat,lng,name};
    markedPoints.push(p);
    const marker=renderMarkedPoint(p);
    if (!map.hasLayer(markedPointsLayer)) markedPointsLayer.addTo(map);
    saveMarkedPoints();
    marker.openPopup();
    return marker;
  }
  try {
    const stored=JSON.parse(localStorage.getItem(pointStorageKey)||"null");
    if (stored && Array.isArray(stored.points)) {
      markedPoints=stored.points.filter(p=>Number.isSafeInteger(p.id)&&p.id>0&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180).map(p=>({id:p.id,lat:p.lat,lng:p.lng,name:String(p.name||"").slice(0,80)}));
      nextPointId=Math.max(Number.isSafeInteger(stored.nextId)?stored.nextId:1,1,...markedPoints.map(p=>p.id+1));
      markedPoints.forEach(renderMarkedPoint);
    }
  } catch(err) {console.warn("Could not restore marked points:",err);}
  // setPointMode: set point mode logic.
  function setPointMode(active) {
    pointPlacementActive=active;
    addPointButton.setAttribute("aria-pressed",String(active));
    addPointButton.textContent=active?"✓ ADD POINT":"ADD POINT";
    map.getContainer().style.cursor=active?"crosshair":"";
  }
  addPointButton.addEventListener("click",()=>{if(lineDrawingActive)cancelLineDrawing();if(measureActive)stopMeasure();setPointMode(!pointPlacementActive);});
  clearPointsButton.addEventListener("click",()=>{
    if (!markedPoints.length) return;
    const confirmed=confirm("Delete all "+markedPoints.length+" marked points?");
    blockDialogClickThrough();
    if (!confirmed) return;
    markedPoints=[];pointMarkers.clear();markedPointsLayer.clearLayers();
    nextPointId=1;saveMarkedPoints();
  });
  enterCoordsButton.addEventListener("click",()=>{pointEntryPanel.hidden=!pointEntryPanel.hidden;pointEntryError.textContent="";});
  document.getElementById("closePointEntry").addEventListener("click",()=>pointEntryPanel.hidden=true);
  pointFormat.addEventListener("change",()=>{
    pointLat.placeholder=pointFormat.value==="dd"?"42.4368":"42° 26.208' N";
    pointLng.placeholder=pointFormat.value==="dd"?"-123.1400":"123° 08.400' W";
  });
  // parsePointCoordinate: parse point coordinate logic.
  function parsePointCoordinate(input,format,latitude) {
    const s=input.trim().toUpperCase().replace(/[−–]/g,"-");
    if (latitude && /[EW]/.test(s)) return NaN;
    if (!latitude && /[NS]/.test(s)) return NaN;
    if (format==="dd") {
      const match=s.match(/^([+-]?\d+(?:\.\d+)?)\s*([NSEW])?$/);
      if (!match) return NaN;
      let value=Number(match[1]);
      if (match[2]) value=Math.abs(value)*(match[2]==="S"||match[2]==="W"?-1:1);
      return value;
    }
    const match=s.match(/^([+-]?\d{1,3})\s*(?:°|D|\s)\s*(\d+(?:\.\d+)?)\s*(?:'|′|M)?\s*([NSEW])?$/);
    if (!match || Number(match[2])>=60) return NaN;
    const neg=match[3] ? /[SW]/.test(match[3]) : match[1].startsWith("-");
    return (Math.abs(Number(match[1]))+Number(match[2])/60)*(neg?-1:1);
  }
  document.getElementById("placeEnteredPoint").addEventListener("click",()=>{
    const lat=parsePointCoordinate(pointLat.value,pointFormat.value,true);
    const lng=parsePointCoordinate(pointLng.value,pointFormat.value,false);
    if (!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) {
      pointEntryError.textContent="Enter valid latitude (-90 to 90) and longitude (-180 to 180).";
      return;
    }
    const marker=addMarkedPoint(lat,lng,pointName.value.trim());
    map.setView([lat,lng],Math.max(map.getZoom(),14));
    marker.openPopup();
    pointEntryPanel.hidden=true;pointEntryError.textContent="";
    pointName.value="";
  });
  map.on("popupopen",event=>{
    const root=event.popup.getElement();
    if (!root) return;
    L.DomEvent.disableClickPropagation(root);
    root.querySelectorAll("[data-point-action]").forEach(button=>{
      button.addEventListener("click",async(event)=>{
        event.stopPropagation();
        const id=Number(button.dataset.pointId);
        const p=markedPoints.find(x=>x.id===id);
        if (!p) return;
        const action=button.dataset.pointAction;
        if (action==="copy") {
          const coords =
  toDDM(Math.abs(p.lat)) + (p.lat >= 0 ? " N" : " S") +
  ", " +
  toDDM(Math.abs(p.lng)) + (p.lng >= 0 ? " E" : " W");
          try { await navigator.clipboard.writeText(coords);button.textContent="COPIED"; }
          catch(err) { window.prompt("Copy coordinates:",coords); }
        } else if (action==="rename") {
          const name=prompt("Point name:",p.name||"");
          blockDialogClickThrough();
          if (name===null) return;
          p.name=name.trim().slice(0,80);
          pointMarkers.get(id).setPopupContent(pointPopup(p));saveMarkedPoints();
        } else if (action==="delete") {
          const confirmed=confirm("Delete point "+id+"?");
          blockDialogClickThrough();
          if (!confirmed) return;
          markedPoints=markedPoints.filter(x=>x.id!==id);
          markedPointsLayer.removeLayer(pointMarkers.get(id));
          pointMarkers.delete(id);saveMarkedPoints();
        }
      });
    });
  });
  [addPointButton,clearPointsButton,enterCoordsButton,pointEntryPanel].forEach(el=>{
    L.DomEvent.disableClickPropagation(el);
    L.DomEvent.disableScrollPropagation(el);
  });


  // =========================================================
  // USER DRAWN LINES — tap vertices; saved locally; GPX export
  // No external drawing library or GIS server calls required.
  // =========================================================
  const lineStorageKey = "topotac.drawnLines.v1";
  const drawLineButton = document.getElementById("drawLineButton");
  const lineDrawPanel = document.getElementById("lineDrawPanel");
  const lineDrawHint = document.getElementById("lineDrawHint");
  const lineUndoButton = document.getElementById("lineUndoButton");
  const lineFinishButton = document.getElementById("lineFinishButton");
  const lineCancelButton = document.getElementById("lineCancelButton");
  const draftLineLayer = L.layerGroup().addTo(map);
  const lineColors = {Orange:"#ff861c",Red:"#e12626",Blue:"#1877f2",Black:"#171717"};
  let drawnLines = [], nextDrawnLineId = 1, lineDrawingActive = false, draftVertices = [];
  function saveDrawnLines() {
    try {localStorage.setItem(lineStorageKey,JSON.stringify({lines:drawnLines,nextId:nextDrawnLineId}));}
    catch(err) {console.warn("Could not save drawn lines:",err);alert("Browser storage is unavailable. Export your line as GPX before closing TopoTac.");}
  }
  function lineLengthMeters(vertices) {
    let meters=0;
    for(let i=1;i<vertices.length;i++)meters+=map.distance(vertices[i-1],vertices[i]);
    return meters;
  }
  function lineLengthLabel(vertices) {
    const meters=lineLengthMeters(vertices);
    return meters>=1609.344?(meters/1609.344).toFixed(2)+" mi":(meters*3.28084).toFixed(0)+" ft";
  }
  function exportDrawnLineGpx(line) {
    const safeXml=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
    const xml='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="TopoTac Online" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>'+safeXml(line.name)+'</name><trkseg>'+line.vertices.map(v=>'<trkpt lat="'+v.lat.toFixed(7)+'" lon="'+v.lng.toFixed(7)+'"/>').join('')+'</trkseg></trk></gpx>';
    const url=URL.createObjectURL(new Blob([xml],{type:"application/gpx+xml"}));
    const filename=(String(line.name || "Line " + line.id).trim().replace(/[\\/:*?"<>|\x00-\x1f]/g,"_").replace(/[. ]+$/g,"").slice(0,120) || "Line " + line.id) + ".gpx";
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  }
  function renderDrawnLine(line) {
    const poly=L.polyline(line.vertices,{color:line.color,weight:5,opacity:0.95}).addTo(drawnLineLayer);
    poly.bindPopup(()=>{
      const wrap=document.createElement("div");
      const title=document.createElement("strong");title.textContent=line.name;wrap.append(title);
      const info=document.createElement("div");info.textContent=lineLengthLabel(line.vertices)+" · "+line.colorName;wrap.append(info);
      const exportBtn=document.createElement("button");exportBtn.type="button";exportBtn.textContent="EXPORT GPX";exportBtn.style.marginRight="8px";
      exportBtn.addEventListener("click",()=>exportDrawnLineGpx(line));wrap.append(exportBtn);
      const deleteBtn=document.createElement("button");deleteBtn.type="button";deleteBtn.textContent="DELETE LINE";
      deleteBtn.addEventListener("click",()=>{
        if(!confirm('Delete line "'+line.name+'"?'))return;
        blockDialogClickThrough();drawnLines=drawnLines.filter(x=>x.id!==line.id);
        drawnLineLayer.removeLayer(poly);saveDrawnLines();map.closePopup();
      });wrap.append(deleteBtn);return wrap;
    });
    poly.on("click",()=>{if(lineDrawingActive)map.closePopup();});
  }
  try {
    const stored=JSON.parse(localStorage.getItem(lineStorageKey)||"null");
    if(stored&&Array.isArray(stored.lines)){
      drawnLines=stored.lines.filter(l=>Number.isSafeInteger(l.id)&&l.id>0&&Array.isArray(l.vertices)&&l.vertices.length>=2&&l.vertices.length<=20000&&l.vertices.every(v=>Number.isFinite(v.lat)&&Number.isFinite(v.lng)&&Math.abs(v.lat)<=90&&Math.abs(v.lng)<=180)).map(l=>({id:l.id,name:String(l.name||"Line").slice(0,80),colorName:lineColors[l.colorName]?l.colorName:"Orange",color:lineColors[l.colorName]||lineColors.Orange,vertices:l.vertices.map(v=>({lat:v.lat,lng:v.lng}))}));
      nextDrawnLineId=Math.max(1,Number.isSafeInteger(stored.nextId)?stored.nextId:1,...drawnLines.map(l=>l.id+1));
      drawnLines.forEach(renderDrawnLine);
    }
  } catch(err) {console.warn("Could not restore drawn lines:",err);}
  function refreshDraftLine() {
    draftLineLayer.clearLayers();
    if(draftVertices.length>1)L.polyline(draftVertices,{color:"#ff861c",weight:4,dashArray:"7,5",interactive:false}).addTo(draftLineLayer);
    draftVertices.forEach(v=>L.circleMarker(v,{radius:4,color:"white",weight:1,fillColor:"#ff861c",fillOpacity:1,interactive:false}).addTo(draftLineLayer));
    lineDrawHint.textContent=draftVertices.length?draftVertices.length+" vertices · "+lineLengthLabel(draftVertices):"Tap map to place vertices";
    lineUndoButton.disabled=draftVertices.length===0;
    lineFinishButton.disabled=draftVertices.length<2;
  }
  function cancelLineDrawing() {
    lineDrawingActive=false;draftVertices=[];draftLineLayer.clearLayers();lineDrawPanel.hidden=true;
    drawLineButton.setAttribute("aria-pressed","false");drawLineButton.textContent="DRAW LINE";
    map.getContainer().style.cursor="";
  }
  drawLineButton.addEventListener("click",()=>{
    if(lineDrawingActive){cancelLineDrawing();return;}
    if(measureActive)stopMeasure();setPointMode(false);
    lineDrawingActive=true;draftVertices=[];lineDrawPanel.hidden=false;
    drawLineButton.setAttribute("aria-pressed","true");drawLineButton.textContent="✓ DRAW LINE";
    map.getContainer().style.cursor="crosshair";refreshDraftLine();
  });
  lineUndoButton.addEventListener("click",()=>{draftVertices.pop();refreshDraftLine();});
  lineCancelButton.addEventListener("click",cancelLineDrawing);
  const lineSaveDialog=document.getElementById("lineSaveDialog");
  const lineSaveForm=document.getElementById("lineSaveForm");
  const lineNameInput=document.getElementById("lineNameInput");
  const lineColorSelect=document.getElementById("lineColorSelect");
  function closeLineSaveDialog(){lineSaveDialog.hidden=true;lineSaveDialog.style.display="none";blockDialogClickThrough();}
  lineFinishButton.addEventListener("click",()=>{
    if(draftVertices.length<2)return;
    lineNameInput.value="Line "+nextDrawnLineId;
    lineColorSelect.value="Orange";
    lineSaveDialog.hidden=false;lineSaveDialog.style.display="flex";
    lineNameInput.focus();lineNameInput.select();
  });
  document.getElementById("lineSaveCancel").addEventListener("click",closeLineSaveDialog);
  lineSaveForm.addEventListener("submit",e=>{
    e.preventDefault();
    if(draftVertices.length<2){closeLineSaveDialog();return;}
    const name=lineNameInput.value.trim().slice(0,80)||"Line "+nextDrawnLineId;
    const colorName=lineColors[lineColorSelect.value]?lineColorSelect.value:"Orange";
    const line={id:nextDrawnLineId++,name,colorName,color:lineColors[colorName],vertices:draftVertices.map(v=>({lat:v.lat,lng:v.lng}))};
    drawnLines.push(line);renderDrawnLine(line);saveDrawnLines();closeLineSaveDialog();cancelLineDrawing();
  });
  L.DomEvent.disableClickPropagation(lineSaveDialog);
  L.DomEvent.disableScrollPropagation(lineSaveDialog);
  map.on("click",e=>{if(!lineDrawingActive||Date.now()<suppressPointClicksUntil)return;draftVertices.push({lat:e.latlng.lat,lng:e.latlng.lng});refreshDraftLine();});
  [drawLineButton,lineDrawPanel,lineUndoButton,lineFinishButton,lineCancelButton].forEach(el=>{L.DomEvent.disableClickPropagation(el);L.DomEvent.disableScrollPropagation(el);});

  // =========================================================
  // AREA MEASUREMENT — POLYGON CORNERS AND ACRES
  // Tap MEASURE AREA, tap polygon corners, then FINISH MEASURE.
  // CLEAR MEASURE removes only the measurement, never marked points.
  // Spherical polygon area is approximate, not a legal survey.
  // =========================================================
  const measureAreaButton=document.getElementById("measureAreaButton");
  const clearMeasureButton=document.getElementById("clearMeasureButton");
  const measureStatus=document.getElementById("measureStatus");
  const measureLayer=L.layerGroup().addTo(map);
  let measureActive=false,measureVertices=[],measureLine=null,measurePolygon=null,measureLabel=null;
  function acreage(latlngs){
    if(latlngs.length<3)return 0;
    const rad=Math.PI/180,R=6378137;
    let sum=0;
    for(let i=0;i<latlngs.length;i++){
      const a=latlngs[i],b=latlngs[(i+1)%latlngs.length];
      let d=(b.lng-a.lng)*rad;
      if(d>Math.PI)d-=2*Math.PI;
      if(d< -Math.PI)d+=2*Math.PI;
      sum+=d*(2+Math.sin(a.lat*rad)+Math.sin(b.lat*rad));
    }
    return Math.abs(sum*R*R/2)/4046.8564224;
  }
  function measureText(){return acreage(measureVertices).toFixed(2)+" acres";}
  function showMeasureStatus(message){measureStatus.hidden=false;measureStatus.textContent=message;}
  function stopMeasure(){
    measureActive=false;
    measureAreaButton.textContent="MEASURE AREA";
    measureAreaButton.setAttribute("aria-pressed","false");
    map.getContainer().style.cursor=pointPlacementActive?"crosshair":"";
  }
  function clearMeasure(){
    stopMeasure();measureVertices=[];measureLayer.clearLayers();
    measureLine=null;measurePolygon=null;measureLabel=null;measureStatus.hidden=true;
  }
  measureAreaButton.addEventListener("click",()=>{
    if(measureActive){
      if(measureVertices.length<3){showMeasureStatus("Add at least 3 corners");return;}
      if(measureLine){measureLayer.removeLayer(measureLine);measureLine=null;}
      if(measurePolygon)measureLayer.removeLayer(measurePolygon);
      measurePolygon=L.polygon(measureVertices,{color:"#ff861c",weight:3,fillColor:"#ff861c",fillOpacity:0.22,interactive:false}).addTo(measureLayer);
      measureLabel=L.marker(measurePolygon.getBounds().getCenter(),{
        interactive:false,icon:L.divIcon({className:"",html:'<span class="measure-acres-label">'+measureText()+'</span>',iconSize:[0,0],iconAnchor:[0,0]})
      }).addTo(measureLayer);
      showMeasureStatus("Area: "+measureText());stopMeasure();return;
    }
    clearMeasure();if(lineDrawingActive)cancelLineDrawing();setPointMode(false);measureActive=true;
    measureAreaButton.textContent="FINISH MEASURE";
    measureAreaButton.setAttribute("aria-pressed","true");
    map.getContainer().style.cursor="crosshair";
    showMeasureStatus("Tap corners on map");
  });
  clearMeasureButton.addEventListener("click",clearMeasure);
  map.on("click",e=>{
    if(!measureActive)return;
    measureVertices.push(e.latlng);
    L.circleMarker(e.latlng,{radius:4,color:"#fff",weight:1,fillColor:"#ff861c",fillOpacity:1,interactive:false}).addTo(measureLayer);
    if(measureLine)measureLayer.removeLayer(measureLine);
    measureLine=L.polyline(measureVertices,{color:"#ff861c",weight:3,interactive:false}).addTo(measureLayer);
    if(measureVertices.length>=3){
      if(measurePolygon)measureLayer.removeLayer(measurePolygon);
      measurePolygon=L.polygon(measureVertices,{color:"#ff861c",weight:1,fillColor:"#ff861c",fillOpacity:0.16,interactive:false}).addTo(measureLayer);
      showMeasureStatus("Area: "+measureText()+" (drawing)");
    }else showMeasureStatus(measureVertices.length+" corner"+(measureVertices.length===1?"":"s")+" placed");
  });
  [measureAreaButton,clearMeasureButton,measureStatus].forEach(el=>{
    L.DomEvent.disableClickPropagation(el);
    L.DomEvent.disableScrollPropagation(el);
  });

  // =========================================================
  // GPS EXPORT & FIELD STATS
  // GPX export includes all recorded segments, even if the layer is hidden.
  // Stats use the browser's latest GPS fix and the track's recorded geometry.
  // =========================================================
  const saveGpsButton = document.getElementById("saveGpsButton");
  const gpsStatsButton = document.getElementById("gpsStatsButton");
  const gpsStatsPanel = document.getElementById("gpsStatsPanel");
  let latestGpsPosition = null;
  let gpsRecordingStart = null;

  function gpsSegmentsForExport() {
    const segments = [];
    gpsTrackLayer.eachLayer(layer => {
      if (!(layer instanceof L.Polyline)) return;
      const points = layer.getLatLngs();
      if (Array.isArray(points) && points.length) segments.push(points);
    });
    return segments;
  }

  function gpsXmlEscape(value) {
    return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  saveGpsButton.addEventListener("click", () => {
    const segments = gpsSegmentsForExport();
    if (!segments.length) { alert("No recorded GPS track points to save."); return; }
    const tracks = segments.map((points,i) =>
      `<trk><name>TopoTac GPS Segment ${i+1}</name><trkseg>` +
      points.map(p => `<trkpt lat="${p.lat.toFixed(7)}" lon="${p.lng.toFixed(7)}"></trkpt>`).join("") +
      `</trkseg></trk>`).join("");
    const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="TopoTac Online" xmlns="http://www.topografix.com/GPX/1/1">${tracks}</gpx>`;
    const blob = new Blob([xml], {type:"application/gpx+xml"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url;a.download="TopoTac_GPS_"+new Date().toISOString().replace(/[:.]/g,"-")+".gpx";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  });

  function formatGpsDDM(value,latitude) {
    const abs=Math.abs(value),degrees=Math.floor(abs),minutes=(abs-degrees)*60;
    return `${degrees}° ${minutes.toFixed(4)}' ${latitude?(value<0?'S':'N'):(value<0?'W':'E')}`;
  }
  function formatGpsDMS(value,latitude) {
    const abs=Math.abs(value),degrees=Math.floor(abs),mins=(abs-degrees)*60;
    const wholeMins=Math.floor(mins),seconds=(mins-wholeMins)*60;
    return `${degrees}° ${wholeMins}' ${seconds.toFixed(2)}" ${latitude?(value<0?'S':'N'):(value<0?'W':'E')}`;
  }
  function recordedTrackStats() {
    let distance=0,count=0;
    for(const segment of gpsSegmentsForExport()) {
      count+=segment.length;
      for(let i=1;i<segment.length;i++) distance+=map.distance(segment[i-1],segment[i]);
    }
    return {distance,count};
  }
  function updateGpsStats() {
    if(gpsStatsPanel.hidden)return;
    const {distance,count}=recordedTrackStats();
    const pos=latestGpsPosition;
    const c=pos?.coords;
    const lat=c?.latitude,lng=c?.longitude;
    const fmt=(value,digits=1)=>Number.isFinite(value)?value.toFixed(digits):"Unavailable";
    const elapsed=gpsRecordingStart?Math.floor((Date.now()-gpsRecordingStart)/1000):null;
    const elapsedText=elapsed===null?'Unavailable':`${Math.floor(elapsed/3600)}h ${Math.floor(elapsed%3600/60)}m ${elapsed%60}s`;
    gpsStatsPanel.innerHTML =
      `<strong>CURRENT POSITION (When GPS is on)</strong>` +
      (Number.isFinite(lat)&&Number.isFinite(lng) ?
       `<div>DD: ${lat.toFixed(6)}, ${lng.toFixed(6)}</div>`+
       `<div>DDM: ${formatGpsDDM(lat,true)} / ${formatGpsDDM(lng,false)}</div>`+
       `<div>DMS: ${formatGpsDMS(lat,true)} / ${formatGpsDMS(lng,false)}</div>` :
       `<div>No current GPS fix</div>`) +
      `<strong>GPS FIX</strong>`+
      `<div>Accuracy: ${c&&Number.isFinite(c.accuracy)?'±'+fmt(c.accuracy,0)+' m':'Unavailable'}</div>`+
      `<div>Speed: ${c&&Number.isFinite(c.speed)?fmt(c.speed*2.236936,1)+' mph':'Unavailable'}</div>`+
      `<div>Heading: ${c&&Number.isFinite(c.heading)?fmt(c.heading,0)+'°':'Unavailable'}</div>`+
      `<strong>RECORDED TRACK</strong>`+
      `<div>Distance: ${(distance/1609.344).toFixed(2)} mi (${(distance/1000).toFixed(2)} km)</div>`+
      `<div>Points: ${count}</div>`+
      `<div>Session elapsed: ${elapsedText}</div>`+
      `<div style="color:#ccc">Distance is based on recorded GPS fixes; accuracy varies.</div>`;
  }
  gpsStatsButton.addEventListener("click",()=>{
    gpsStatsPanel.hidden=!gpsStatsPanel.hidden;
    gpsStatsButton.setAttribute('aria-expanded',String(!gpsStatsPanel.hidden));
    updateGpsStats();
  });
  setInterval(updateGpsStats,1000);

  // =========================================================
  // PHONE GPS
  // =========================================================

  const gpsButton = document.getElementById("gpsButton");

  let gpsWatchId = null;
  let gpsMarker = null;
  let gpsAccuracy = null;
  let gpsHasCentered = false;

  const gpsIcon = L.divIcon({
    className: "",
    html: '<div class="gps-location-dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });

  L.DomEvent.disableClickPropagation(gpsButton);

  // stopGpsTracking: stop gps tracking logic.
  function stopGpsTracking() {
    situsRequest++;
    lastSitusPoint = null;
    situsDisplay.textContent = "Situs: GPS off";
  endGpsTrackSegment();
    if (gpsWatchId !== null && navigator.geolocation) {
      navigator.geolocation.clearWatch(gpsWatchId);
    }

    gpsWatchId = null;
    gpsHasCentered = false;

    if (gpsMarker) {
      map.removeLayer(gpsMarker);
      gpsMarker = null;
    }

    if (gpsAccuracy) {
      map.removeLayer(gpsAccuracy);
      gpsAccuracy = null;
    }

    gpsButton.setAttribute("aria-pressed", "false");
    gpsButton.textContent = "GPS";
    gpsButton.title = "Show my phone's GPS location";

    gpsCoordinatesDisplay.textContent =
      "GPS: Off — tap GPS to start";
  }

  // gpsError: gps error logic.
  function gpsError(error) {
    stopGpsTracking();

    if (error.code === 1) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Permission denied. Allow browser location access, then try again.";
    } else if (error.code === 2) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Could not determine location. Check device location services.";
    } else if (error.code === 3) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Timed out. Tap GPS to try again.";
    } else {
      gpsCoordinatesDisplay.textContent =
        "GPS: Unable to get location.";
    }
  }

  gpsButton.addEventListener("click", function () {
    if (gpsWatchId !== null) {
      stopGpsTracking();
      return;
    }

    if (!("geolocation" in navigator)) {
      gpsCoordinatesDisplay.textContent =
        "GPS: This browser does not support location access.";
      return;
    }

    if (!window.isSecureContext) {
      gpsCoordinatesDisplay.textContent =
        "GPS: Requires a secure HTTPS page. Open the map using HTTPS.";
      return;
    }

    gpsHasCentered = false;

    gpsButton.setAttribute("aria-pressed", "true");
    gpsButton.textContent = "GPS…";
    gpsButton.title = "Stop GPS tracking";

    gpsCoordinatesDisplay.textContent =
      "GPS: Waiting for device location…";

    gpsWatchId = navigator.geolocation.watchPosition(
      function (position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = Math.max(
          0,
          position.coords.accuracy || 0
        );

        const location = L.latLng(lat, lng);

 // Record each new GPS position for the track.

     if (!gpsRecordingStart) gpsRecordingStart=Date.now();
     latestGpsPosition=position;
     recordGpsTrackPoint(location);
     updateGpsStats();

        if (!gpsAccuracy) {
          gpsAccuracy = L.circle(location, {
            radius: accuracy,
            className: "gps-accuracy-circle",
            interactive: false
          }).addTo(map);
        } else {
          gpsAccuracy.setLatLng(location);
          gpsAccuracy.setRadius(accuracy);
        }

        if (!gpsMarker) {
          gpsMarker = L.marker(location, {
            icon: gpsIcon,
            interactive: false,
            keyboard: false,
            zIndexOffset: 1000
          }).addTo(map);
        } else {
          gpsMarker.setLatLng(location);
        }

        gpsCoordinatesDisplay.innerHTML =
          '<span class="gps-lat">Lat: ' + toDDM(lat) + '</span>' +
          '<span class="gps-lng">Lon: ' + toDDM(lng) +
          ' (±' + Math.round(accuracy) + ' m) GPS</span>';

        gpsButton.textContent = "GPS ON";
        updateGpsSitus(lat, lng, false);

        if (!gpsHasCentered) {
          map.setView(
            location,
            Math.max(map.getZoom(), 17)
          );

          gpsHasCentered = true;
        }
      },
      gpsError,
      {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 20000
      }
    );
  });

  // =========================================================
  // INITIAL MAP SIZING
  // =========================================================

  setTimeout(function () {
    map.invalidateSize();
  }, 500);

})();
</script>

</body>
