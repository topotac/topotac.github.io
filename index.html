<!--
 TOPOTAC SOURCE GUIDE
 01. Styles: map, controls, drawer, legend, and responsive layouts
 02. Markup: controls, GPS/situs readouts, GPX input, marked points
 03. Tools drawer and legend behavior
 04. Leaflet initialization and base maps
 05. ArcGIS exports: LiDAR, PLSS, public land, taxlots
 06. Parcel identify and GPS situs lookup
 07. Fire activity, current/historical perimeters
 08. Other layers: RAWS, USGS water, and additional overlays
 09. GPS tracking, GPX import, coordinate entry, marked points
 10. Refresh scheduling, layer controls, and event listeners
 Keep index.html and guide.html in the same directory.
-->

/* Field test: single-tap GPS stacked above situs and GPS coordinates. */


#addressSearchPanel {position:absolute;z-index:3500;top:60px;left:8px;width:min(330px,calc(100vw - 16px));background:#fff;border:2px solid #ff861c;border-radius:9px;box-shadow:0 3px 16px #555;padding:12px;box-sizing:border-box;color:#111;font:13px Arial;}

/* Mobile touch fix: the open TOOLS drawer must sit above the floating GPS button.

<script>
(function () {
  "use strict";

  const map = L.map("map", {
    zoomControl: false,
    doubleClickZoom: true
  }).setView([42.4368, -123.1400], 9);

  // ZOOM CONTROLS — fixed in the lower-right corner.
  L.control.zoom({position:"bottomright",zoomInTitle:"Zoom in",zoomOutTitle:"Zoom out"}).addTo(map);

  // =========================================================
  // BASE MAPS
  // =========================================================

  const streetMap = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Tiles &copy; Esri",
      maxZoom: 19
    }
  ).addTo(map);

  const topoMap = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenTopoMap contributors",
      maxZoom: 19
    }
  );

  const aerialMap = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Imagery &copy; Esri, Vantor, Earthstar Geographics, and the GIS User Community",
      maxZoom: 19
    }
  );

  // =========================================================
  // DOGAMI LIDAR HILLSHADE
  // =========================================================

  const dogamiUrl =
    "https://gis.dogami.oregon.gov/arcgis/rest/services/lidar/DIGITAL_TERRAIN_MODEL_MOSAIC_HS/ImageServer/exportImage";

  const hillshade = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 0.80,
      interactive: false
    }
  );

  // =========================================================
  // PUBLIC LAND OWNERSHIP
  // =========================================================

  const publicLandUrl =
    "https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/PublicOwnership/MapServer/export";

  const publicLand = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 0.65,
      interactive: false
    }
  );

  // =========================================================
  // PLSS SECTIONS
  // =========================================================

  const plssUrl =
    "https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/PLSS/MapServer/export";

  const plss = L.imageOverlay(
    "",
    [[42.0, -124.0], [43.0, -122.0]],
    {
      opacity: 1,
      interactive: false
    }
  );

  // County parcel outlines plus statewide coverage everywhere (optional backup).
  const taxlotService = "https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/TaxlotsDisplay/MapServer";
  const taxlots = L.imageOverlay("", [[42,-124],[43,-122]], {opacity:0.9,interactive:false});
  const jacksonTaxlots = L.imageOverlay("", [[42,-124],[43,-122]], {opacity:0.9,interactive:false});
  const josephineTaxlots = L.imageOverlay("", [[42,-124],[43,-122]], {opacity:0.9,interactive:false});
  const countyMapServices = new Map([
    [jacksonTaxlots,"https://jcportal.jacksoncountyor.gov/server/rest/services/Property/Taxlots/MapServer"],
    [josephineTaxlots,"https://gis.co.josephine.or.us/arcgis/rest/services/Assessor/Assessor_Taxlots/MapServer"]
  ]);
  const parcelOverlayRequests = new Map();
  let situsRequest = 0;
  let lastSitusPoint = null;
  let lastSitusTime = 0;
  const situsDisplay = document.getElementById("situsAddress");
  const taxlotOverlays = [josephineTaxlots, jacksonTaxlots, taxlots];
  // Test server-side orange line styling on Jackson; fall back to native imagery on failure.
  const jacksonTestRenderer = JSON.stringify([{id:2,source:{type:"mapLayer",mapLayerId:2},drawingInfo:{renderer:{type:"simple",symbol:{type:"esriSFS",style:"esriSFSNull",outline:{type:"esriSLS",style:"esriSLSSolid",color:[255,140,0,255],width:1.2}}}}}]);

  // Request only one image for the current viewport and selected overlay.
  function updateTaxlots() {
    for (const layer of taxlotOverlays) {
      const request = (parcelOverlayRequests.get(layer)||0)+1;
      parcelOverlayRequests.set(layer,request);
      if (!map.hasLayer(layer) || map.getZoom()<14) { layer.setOpacity(0); continue; }
      const bounds=map.getBounds(), size=map.getSize();
      const sw=L.CRS.EPSG3857.project(bounds.getSouthWest());
      const ne=L.CRS.EPSG3857.project(bounds.getNorthEast());
      const params={bbox:[sw.x,sw.y,ne.x,ne.y].join(","),bboxSR:"3857",imageSR:"3857",
        size:Math.round(size.x)+","+Math.round(size.y),format:"png32",transparent:"true",f:"image"};
      if(layer===taxlots) {
        params.layers="show:"+Array.from({length:36},(_,i)=>i).join(",");
      } else {
        // Josephine MapServer has one parcel layer; Jackson uses Taxlots layer 2.
        params.layers=layer===jacksonTaxlots?"show:2":"show:0";
      }
      const baseUrl=(countyMapServices.get(layer)||taxlotService)+"/export";
      const fallbackUrl=makeExportUrl(baseUrl,params);
      if(layer===jacksonTaxlots) params.dynamicLayers=jacksonTestRenderer;
      const url=makeExportUrl(baseUrl,params);
      const img=new Image();
      img.onload=()=>{if(parcelOverlayRequests.get(layer)!==request||!map.hasLayer(layer))return;
        layer.setBounds(bounds);layer.setUrl(url);layer.setOpacity(.9);};
      img.onerror=()=>{
        if(layer===jacksonTaxlots && url!==fallbackUrl){
          const backup=new Image();
          backup.onload=()=>{if(parcelOverlayRequests.get(layer)!==request||!map.hasLayer(layer))return;layer.setBounds(bounds);layer.setUrl(fallbackUrl);layer.setOpacity(.9);};
          backup.onerror=()=>console.warn("Jackson parcel image unavailable (styled and default)");
          backup.src=fallbackUrl;
        } else console.warn("Parcel boundary image failed",url);
      };
      img.src=url;
    }
  }

  // ArcGIS REST JSONP fallback for services that do not allow browser CORS.
  // arcgisJsonp: arcgis jsonp logic.
  function arcgisJsonp(url, params) {
    return new Promise((resolve, reject) => {
      const callback = "__odfTaxlotCallback" + Date.now() + "_" + Math.floor(Math.random() * 1000000);
      const script = document.createElement("script");
      let finished = false;
      const timer = setTimeout(() => finish(new Error("Service timed out")), 12000);
      // finish: finish logic.
      function finish(error, result) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        delete window[callback];
        script.remove();
        if (error) reject(error); else resolve(result);
      }
      window[callback] = data => finish(null, data);
      script.onerror = () => finish(new Error("Service blocked or unreachable"));
      const q = new URLSearchParams(params);
      q.set("f", "json");
      q.set("callback", callback);
      script.src = url + "?" + q.toString();
      document.head.appendChild(script);
    });
  }

  // taxlotRest: taxlot rest logic.
  async function taxlotRest(url, params) {
    const query = new URLSearchParams(params);
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 7000);
      let response;
      try { response = await fetch(url + "?" + query, {signal: controller.signal}); }
      finally { clearTimeout(timer); }
      if (!response.ok) throw Error("HTTP " + response.status);
      const data = await response.json();
      if (data.error) throw Error(data.error.message || "ArcGIS service error");
      return data;
    } catch (firstError) {
      console.warn("Tax lot direct request failed; trying JSONP:", firstError);
      const data = await arcgisJsonp(url, params);
      if (data.error) throw Error(data.error.message || "ArcGIS service error");
      return data;
    }
  }

  // Load the two county boundaries once; use point-in-polygon to select exactly one parcel service.
  const parcelSources={
    Jackson:{name:"Jackson County",url:"https://jcportal.jacksoncountyor.gov/server/rest/services/Property/Taxlots/FeatureServer/2/query",layer:jacksonTaxlots},
    Josephine:{name:"Josephine County",url:"https://gis.co.josephine.or.us/arcgis/rest/services/Assessor/Assessor_Taxlots/FeatureServer/0/query",layer:josephineTaxlots},
    Oregon:{name:"Oregon statewide",url:"https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/TaxlotsDisplay/MapServer",layer:taxlots}
  };
  const countyBoundaryUrl="https://gis.wrd.state.or.us/server/rest/services/adm/Counties_WGS84/FeatureServer/0/query";
  let countyBoundariesPromise=null;
  function countyBoundaries() {
    if(!countyBoundariesPromise) countyBoundariesPromise=taxlotRest(countyBoundaryUrl,{
      where:"county_name IN ('Jackson','Josephine')",outFields:"county_name",returnGeometry:"true",
      outSR:"4326",geometryPrecision:"5",f:"json"
    }).then(d=>{
      const features=d.features||[];
      if(features.length!==2) throw Error("County boundary lookup incomplete");
      return features;
    }).catch(e=>{countyBoundariesPromise=null;throw e;});
    return countyBoundariesPromise;
  }
  // Standard ray-casting test for ArcGIS polygon rings; handles holes via even/odd parity.
  function insideRing(x,y,ring) {
    let inside=false;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++) {
      const a=ring[i],b=ring[j];
      if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))inside=!inside;
    }
    return inside;
  }
  async function parcelSourceAt(lat,lng) {
    const features=await countyBoundaries();
    for(const f of features) {
      const rings=(f.geometry&&f.geometry.rings)||[];
      if(rings.some(r=>insideRing(lng,lat,r)))return parcelSources[f.attributes.county_name];
    }
    return parcelSources.Oregon;
  }
  function field(a,...names) {
    for(const n of names) {
      const k=Object.keys(a).find(key=>key.toLowerCase()===n.toLowerCase());
      if(k&&a[k]!=null&&String(a[k]).trim()!==""&&String(a[k]).toLowerCase()!=="null")return String(a[k]).trim();
    }
    return "";
  }
  function parcelDetails(a,county) {
    const street=field(a,...(county==="Jackson"?["SITEADD"]:county==="Josephine"?["SITUS"]:["SITEADDNAM","SITUS","SITEADD"]));
    const city=field(a,"SITUS_CITY","SITEADDCTY"),zip=field(a,"SITUS_ZIP","SITEZIP");
    const address=[street,[city,zip].filter(Boolean).join(" ")].filter(Boolean).join(", ");
    const owner=field(a,"FEEOWNER","NAME","OWNERLINE1");
    const mailStreet=field(a,"ADDRESS1","ADDR1","MAILADD1","ADDRESS");
    const mailStreet2=field(a,"ADDRESS2","ADDR2","MAILADD2");
    const mailCity=field(a,"CITY","MAILCITY"),mailState=field(a,"STATE","MAILSTATE"),mailZip=field(a,"ZIPCODE","ZIP","MAILZIP");
    const mailing=[mailStreet,mailStreet2,[mailCity,mailState,mailZip].filter(Boolean).join(" ")].filter(Boolean).join(", ");
    return {address,owner,mailing,lot:field(a,"MAPLOT","TM_MAPLOT","MapNum","MAPNUMBER","MAPNUM","ORTaxlot","TAXLOT"),
      account:field(a,"ACCOUNT"),acres:field(a,"ACREAGE","GIS_AREA","LEGAL_ACRE"),
      propertyClass:field(a,"PROPCLASS","PROP_CLASS"),yearBuilt:field(a,"YEARBLT")};
  }
  async function queryParcelAt(lat,lng,selectedSource) {
    const source=selectedSource||await parcelSourceAt(lat,lng);
    const params={where:"1=1",geometry:JSON.stringify({x:lng,y:lat,spatialReference:{wkid:4326}}),
      geometryType:"esriGeometryPoint",inSR:"4326",spatialRel:"esriSpatialRelIntersects",
      outFields:"*",returnGeometry:"false",resultRecordCount:"3",f:"json"};
    // Statewide service is available in every county as an optional backup.
    if(source===parcelSources.Oregon) {
      const ids=Array.from({length:36},(_,i)=>i);
      // ArcGIS identify handles the county selection server-side in one request.
      const point=L.CRS.EPSG3857.project(L.latLng(lat,lng));
      const data=await taxlotRest(source.url+"/identify",{
        geometry:JSON.stringify({x:lng,y:lat,spatialReference:{wkid:4326}}),geometryType:"esriGeometryPoint",
        sr:"4326",layers:"all:"+ids.join(","),tolerance:"0",mapExtent:[point.x-100,point.y-100,point.x+100,point.y+100].join(","),
        imageDisplay:"500,500,96",returnGeometry:"false",f:"json"
      });
      const hit=(data.results||[])[0];
      return hit?{source:source.name,details:parcelDetails(hit.attributes||{},"Oregon")}:null;
    }
    const data=await taxlotRest(source.url,params);
    const hit=(data.features||[])[0];
    return hit?{source:source.name,details:parcelDetails(hit.attributes||{},source===parcelSources.Jackson?"Jackson":"Josephine")}:null;
  }
  let parcelClickSequence=0;
  async function identifyClickedParcel(latlng) {
    if(map.getZoom()<14)return;
    const sequence=++parcelClickSequence;
    if(!map.hasLayer(josephineTaxlots) && !map.hasLayer(jacksonTaxlots) && !map.hasLayer(taxlots))return;
    const preferred=await parcelSourceAt(latlng.lat,latlng.lng);
    if(sequence!==parcelClickSequence)return;
    const source=map.hasLayer(preferred.layer)?preferred:(map.hasLayer(taxlots)?parcelSources.Oregon:null);
    if(!source)return;
    const popup=L.popup().setLatLng(latlng).setContent("Looking up tax lot…").openOn(map);
    try {
      popup.setContent("Looking up tax lot…");
      let match;
      try { match=await queryParcelAt(latlng.lat,latlng.lng,source); }
      catch(err) {
        if(source!==parcelSources.Oregon && map.hasLayer(taxlots)) match=await queryParcelAt(latlng.lat,latlng.lng,parcelSources.Oregon);
        else throw err;
      }
      if(sequence!==parcelClickSequence||!map.hasLayer(source.layer))return;
      if(!match){popup.setContent("No parcel information reported at this location.");return;}
      const d=match.details;
      const rows=[["Situs",d.address],["Owner",d.owner],["Mailing address",d.mailing],["Map / Taxlot",d.lot],
        ["Account",d.account],["Acres",d.acres],["Property class",d.propertyClass],["Year built",d.yearBuilt]];
      popup.setContent("<div style='min-width:205px;max-width:290px;line-height:1.5'><strong>"+escapeHtml(match.source)+" Parcel</strong><br>"+
        rows.filter(r=>r[1]).map(r=>"<strong>"+escapeHtml(r[0])+":</strong> "+escapeHtml(r[1])).join("<br>")+
        "<br><small>County assessor reference data; not a legal survey.</small></div>");
    }catch(err){if(sequence===parcelClickSequence)popup.setContent("Parcel lookup unavailable: "+escapeHtml(err.message||String(err)));}
  }
  // GPS situs is intentionally independent of parcel outline checkbox state.
  async function updateGpsSitus(lat,lng,force) {
    const point=L.latLng(lat,lng),now=Date.now();
    if(!force&&lastSitusPoint&&point.distanceTo(lastSitusPoint)<25&&now-lastSitusTime<30000)return;
    lastSitusPoint=point;lastSitusTime=now;
    const request=++situsRequest;
    situsDisplay.textContent="Situs: Looking up parcel…";
    try {
      let match;
      try { match=await queryParcelAt(lat,lng); }
      catch(err) {
        // If the county service fails, use statewide without needing its outline checkbox.
        match=await queryParcelAt(lat,lng,parcelSources.Oregon);
      }
      if(request!==situsRequest)return;
      situsDisplay.textContent=match&&match.details.address?"Situs: "+match.details.address:"Situs: No parcel address reported at GPS location";
    }catch(err){if(request===situsRequest)situsDisplay.textContent="Situs: Lookup unavailable";console.warn("GPS situs:",err);}
  }

  let hillshadeRequest = 0;
  let plssRequest = 0;
  let publicLandRequest = 0;
  let refreshTimer = null;

  // makeExportUrl: make export url logic.
  function makeExportUrl(serviceUrl, params) {
    return serviceUrl + "?" + new URLSearchParams(params).toString();
  }

  // Exports DOGAMI hillshade for the current map extent.
  function updateHillshade() {
    if (!map.hasLayer(hillshade)) return;

    const size = map.getSize();
    if (size.x < 1 || size.y < 1) return;

    const bounds = map.getBounds();
    const south = bounds.getSouth();
    const west = bounds.getWest();
    const north = bounds.getNorth();
    const east = bounds.getEast();

    const imageBounds = L.latLngBounds(
      [south, west],
      [north, east]
    );

  // =========================================================

  // escapeHtml: escape html logic.
  function escapeHtml(value) {
    return String(value == null || value === "" ? "Not reported" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // =========================================================
  // NIFC / IRWIN FIRE ACTIVITY — LAST 24 HOURS
  // =========================================================

  const nifc24hUrl =
    "https://services3.arcgis.com/T4QMspbfLg3qTGWY/ArcGIS/rest/services/WFIGS_Incident_Locations_Last24h/FeatureServer/0/query";

  const nifcFireLayer = L.layerGroup().addTo(map);
  let nifcRefreshInProgress = false;

  // fireTypeLabel: fire type label logic.
  function fireTypeLabel(code) {
    if (code === "WF") return "Wildfire";
    if (code === "RX") return "Prescribed fire";
    if (code === "CX") return "Incident complex";
    return code || "Fire activity";
  }

  // fireMarkerColor: fire marker color logic.
  function fireMarkerColor(code) {
    if (code === "RX") return "#2e9d50";
    if (code === "CX") return "#f28c00";
    if (code === "WF") return "#d62828";
    return "#555555";
  }

  // Fetches recent Oregon incident points and replaces the fire layer.
  async function updateNifcFires() {
    if (nifcRefreshInProgress || !map.hasLayer(nifcFireLayer)) return;

    nifcRefreshInProgress = true;

    const params = new URLSearchParams({
      where: "POOState = 'US-OR'",
      outFields: "IncidentName,IncidentTypeCategory,InitialLatitude,InitialLongitude,POOCounty,POOProtectingAgency,POOState,FireDiscoveryDateTime",
      outSR: "4326",
      f: "json"
    });

    try {
      const response = await fetch(
        nifc24hUrl + "?" + params.toString()
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error.message || "NIFC query failed");
      }

      const replacementLayer = L.layerGroup();
      const seenFireLocations = new Map();
      const features = Array.isArray(data.features) ? data.features : [];

      features.forEach(function (feature) {
        const props = feature.attributes || {};
        const geometry = feature.geometry || {};

        const lat = Number(
          geometry.y != null ? geometry.y : props.InitialLatitude
        );

        const lng = Number(
          geometry.x != null ? geometry.x : props.InitialLongitude
        );

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng) ||
          lat < -90 || lat > 90 ||
          lng < -180 || lng > 180 ||
          (lat === 0 && lng === 0)
        ) return;

        const type = props.IncidentTypeCategory || "";
        const discoveryDate = props.FireDiscoveryDateTime
        ? new Date(props.FireDiscoveryDateTime).toLocaleString()
        : "Not reported";
        const fireName = props.IncidentName || "Unnamed Fire";
        const fireLabel = `${type || "Fire"}-${fireName}`;

        const marker = L.circleMarker([lat, lng], {
          radius: 6,
          color: "#ffffff",
          weight: 1.5,
          fillColor: fireMarkerColor(type),
          fillOpacity: 1
        });

        const locationKey = `${lat.toFixed(5)},${lng.toFixed(5)}`;
        const duplicateCount = seenFireLocations.get(locationKey) || 0;

        seenFireLocations.set(locationKey, duplicateCount + 1);

        const labelOffsetY = duplicateCount * 25;

        marker.bindTooltip(fireLabel, {
          permanent: true,
          direction: "right",
          offset: [7, -labelOffsetY],
          className: "fire-label"
        });

        const popup =
          "<div style='min-width:180px'>" +
          "<strong>" + escapeHtml(fireName) + "</strong><br>" +
          "Type: " + escapeHtml(fireTypeLabel(type)) + "<br>" +
          "Discovery date/time: " + escapeHtml(discoveryDate) + "<br>" +
          "County: " + escapeHtml(props.POOCounty) + "<br>" +
          "Protecting agency: " + escapeHtml(props.POOProtectingAgency) + "<br>" +
          "State: " + escapeHtml(props.POOState) +
          "</div>";

        marker.bindPopup(popup);
        marker.addTo(replacementLayer);
      });

      nifcFireLayer.clearLayers();

      replacementLayer.eachLayer(function (layer) {
        layer.addTo(nifcFireLayer);
      });

      console.info(
        "NIFC/IRWIN Oregon incidents in last-24-hour feed:",
        features.length
      );

    } catch (error) {
      console.error("Could not refresh NIFC/IRWIN fire activity:", error);
    } finally {
      nifcRefreshInProgress = false;
    }
  }

  updateNifcFires();

  // updateFirePerimeters: update fire perimeters logic.
  async function updateFirePerimeters(force = false) {
    if (!map.hasLayer(firePerimeterLayer)) return;
    if (map.getZoom() < 9) {
      currentRequestSequence++;
      if (currentAbortController) currentAbortController.abort();
      currentAbortController = null;
      currentLastViewKey = "";
      firePerimeterLayer.clearLayers();
      return;
    }
    const bounds = map.getBounds();
    const sw = L.CRS.EPSG3857.project(bounds.getSouthWest());
    const ne = L.CRS.EPSG3857.project(bounds.getNorthEast());
    const bbox = [sw.x, sw.y, ne.x, ne.y].join(",");
    const viewKey = bbox;
    if (!force && currentLastViewKey === viewKey) return;
    const sequence = ++currentRequestSequence;
    if (currentAbortController) currentAbortController.abort();
    const controller = new AbortController();
    currentAbortController = controller;
    const base = {
      where: "1=1", geometry: bbox, geometryType: "esriGeometryEnvelope",
      inSR: "3857", spatialRel: "esriSpatialRelIntersects",
      outFields: "OBJECTID,poly_IncidentName,poly_GISAcres,attr_POOCounty",
      outSR: "4326", returnGeometry: "true", orderByFields: "OBJECTID ASC",
      resultRecordCount: "1000", f: "json"
    };
    try {
      const features = [];
      for (let offset = 0; ; offset += 1000) {
        const params = new URLSearchParams({...base, resultOffset: String(offset)});
        const response = await fetch(perimeterQueryUrl + "?" + params, {signal: controller.signal});
        if (!response.ok) throw Error("Current perimeter HTTP " + response.status);
        const data = await response.json();
        if (data.error) throw Error(data.error.message || "Current perimeter query failed");
        if (sequence !== currentRequestSequence || !map.hasLayer(firePerimeterLayer) || map.getZoom() < 9) return;
        const page = Array.isArray(data.features) ? data.features : [];
        features.push(...page);
        if (!page.length || (!data.exceededTransferLimit && page.length < 1000)) break;
      }
      const replacementLayer = L.layerGroup();
      features.forEach(function(feature) {
        const attrs = feature.attributes || {};
        const rings = feature.geometry && Array.isArray(feature.geometry.rings) ? feature.geometry.rings : [];
        if (!rings.length) return;
        const latLngRings = rings.map(ring => ring.map(point => [Number(point[1]), Number(point[0])]));
        if (!latLngRings[0] || latLngRings[0].length < 3) return;
        const polygon = L.polygon(latLngRings, perimeterStyle());
        polygon.bindPopup("<div style='min-width:180px'><strong>" +
          escapeHtml(attrs.poly_IncidentName || "Unnamed fire perimeter") + "</strong><br>County: " +
          escapeHtml(attrs.attr_POOCounty) + "<br>Reported size: " +
          escapeHtml(formatAcres(attrs.poly_GISAcres)) + "</div>");
        polygon.addTo(replacementLayer);
      });
      firePerimeterLayer.clearLayers();
      replacementLayer.eachLayer(layer => layer.addTo(firePerimeterLayer));
      currentLastViewKey = viewKey;
      currentLastFetch = Date.now();
      console.info("Current fire perimeters in view:", features.length);
    } catch(error) {
      if (error.name !== "AbortError") console.error("Current perimeter query failed:", error);
    } finally {
      if (sequence === currentRequestSequence) currentAbortController = null;
    }
  }

  // formatHistoricalDate: format historical date logic.
  function formatHistoricalDate(value) {
    if (value == null || value === "") return "Not reported";

    const timestamp = Number(value);

    if (!Number.isFinite(timestamp) || timestamp <= 0) {
      return "Not reported";
    }

    const date = new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "Not reported";

    return escapeHtml(date.toLocaleDateString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric"
    }));
  }

  // formatHistoricalDateTime: format historical date time logic.
  function formatHistoricalDateTime(value) {
    if (value == null || value === "") return "Not reported";

    const timestamp = Number(value);

    if (!Number.isFinite(timestamp) || timestamp <= 0) {
      return "Not reported";
    }

    const date = new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "Not reported";

    return escapeHtml(date.toLocaleString());
  }

  // formatHistoricalCoordinate: format historical coordinate logic.
  function formatHistoricalCoordinate(value) {
    const number = Number(value);

    if (!Number.isFinite(number)) return "Not reported";

    const sign = number < 0 ? "-" : "";
    const absolute = Math.abs(number);
    const degrees = Math.floor(absolute);
    const minutes = ((absolute - degrees) * 60).toFixed(3);

    return sign + degrees + "° " + minutes + "'";
  }

  // historicalFireType: historical fire type logic.
  function historicalFireType(code) {
    if (code === "WF") return "Wildfire";
    if (code === "RX") return "Prescribed fire";
    if (code === "CX") return "Incident complex";
    return code || "Not reported";
  }

// historicalPerimeterStyle: historical perimeter style logic.
function historicalPerimeterStyle() {

  // updateHistoricalFirePerimeters: update historical fire perimeters logic.

  const rawsQueryUrl =

  const rawsLayer = L.layerGroup().addTo(map);
  let rawsRefreshInProgress = false;

  // rawsValue: raws value logic.
  function rawsValue(value, suffix) {
    if (
      value == null ||
      String(value).trim() === "" ||
      String(value).trim().toUpperCase() === "NO DATA"
    ) {
      return "Not reported";
    }

    return escapeHtml(String(value).trim()) + (suffix || "");
  }

  // rawsTemperature: raws temperature logic.
  function rawsTemperature(value) {
    if (
      value == null ||
      String(value).trim() === "" ||
      String(value).trim().toUpperCase() === "NO DATA"
    ) {
      return "Not reported";
    }

    const temperature = String(value)
      .trim()
      .replace(/ deg\. F/i, "")
      .replace(/°\s*F/i, "")
      .trim();

    return escapeHtml(temperature) + "F";
  }

  // rawsWindDirection: raws wind direction logic.
  function rawsWindDirection(value) {
    if (
      value == null ||
      String(value).trim() === "" ||
      String(value).trim().toUpperCase() === "NO DATA"
    ) {
      return "Not reported";
    }

    const degrees = Number(value);

    if (!Number.isFinite(degrees)) {
      return rawsValue(value, "");
    }

    const directions = [
      "N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE",
      "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"
    ];

    const compass = directions[
      Math.round((((degrees % 360) + 360) % 360) / 22.5) % 16
    ];

    return compass + " (" + degrees + "°)";
  }

  // rawsObservationTime: raws observation time logic.
  function rawsObservationTime(value) {
    if (value == null || value === "") return "Not reported";

    const timestamp = Number(value);

    if (
      !Number.isFinite(timestamp) ||
      timestamp <= 0 ||
      timestamp < Date.UTC(2000, 0, 1)
    ) {
      return "Not reported";
    }

    const date = new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "Not reported";

    return escapeHtml(date.toLocaleString());
  }

  // updateRawsStations: update raws stations logic.
  async function updateRawsStations() {
    if (rawsRefreshInProgress || !map.hasLayer(rawsLayer)) return;

    rawsRefreshInProgress = true;

    const params = new URLSearchParams({
      where: "Status = 'A' AND State = 'OR'",
      outFields:
        "StationName,ObservedDate,Elevation,Latitude,Longitude," +
        "State,County,Status,RainAccumulation,WindSpeedMPH," +
        "WindDirDegrees,AirTempStandPlace,RelativeHumidity," +
        "WindSpeedPeak,WindDirPeak,StationID,MesoWestStationID," +
        "WXID,MesoWestURL",
      outSR: "4326",
      returnGeometry: "true",
      f: "json"
    });

    try {
      const response = await fetch(
        rawsQueryUrl + "?" + params.toString()
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error.message || "RAWS query failed");
      }

      const replacementLayer = L.layerGroup();
      const features = Array.isArray(data.features) ? data.features : [];

      features.forEach(function (feature) {
        const a = feature.attributes || {};
        const g = feature.geometry || {};

        const lat = Number(g.y != null ? g.y : a.Latitude);
        const lng = Number(g.x != null ? g.x : a.Longitude);

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng) ||
          lat < -90 || lat > 90 ||
          lng < -180 || lng > 180 ||
          (lat === 0 && lng === 0)
        ) return;

        const tempText = rawsTemperature(a.AirTempStandPlace);

        const marker = L.marker([lat, lng], {
          icon: L.divIcon({
            className: "",
            html: `
              <div style="display:flex;align-items:center;gap:3px;white-space:nowrap;">
                <div style="
                  width:12px;
                  height:12px;
                  flex-shrink:0;
                  background:#008CFF;
                  border:2px solid white;
                  box-shadow:0 1px 4px #555;
                  box-sizing:border-box;
                "></div>
                <span style="
                  color:#111;
                  background:rgba(255,255,255,0.9);
                  padding:1px 3px;
                  border-radius:3px;
                  font-size:12px;
                  font-weight:bold;
                ">${tempText}</span>
              </div>
            `,
            iconSize: [150, 18],
            iconAnchor: [6, 9]
          })
        });

        let popup =
          "<div style='min-width:210px;max-width:270px;line-height:1.5'>" +
          "<strong style='font-size:15px'>" +
          escapeHtml(a.StationName || "Unnamed RAWS station") +
          "</strong><br>" +
          "<span style='color:#555'>" +
          escapeHtml(a.County || "Oregon") + " County RAWS</span>" +
          "<hr style='margin:6px 0'>" +
          "<strong>Temperature:</strong> " +
          rawsTemperature(a.AirTempStandPlace) + "<br>" +
          "<strong>Relative humidity:</strong> " +
          rawsValue(a.RelativeHumidity, "").replace(/\s*%$/, "") +
          (a.RelativeHumidity == null ||
           String(a.RelativeHumidity).trim() === "" ||
           String(a.RelativeHumidity).trim().toUpperCase() === "NO DATA"
            ? ""
            : "%") + "<br>" +
          "<strong>Wind:</strong> " +
          rawsValue(a.WindSpeedMPH, "") + " · " +
          rawsWindDirection(a.WindDirDegrees) + "<br>" +
          "<strong>Peak wind:</strong> " +
          rawsValue(a.WindSpeedPeak, "") + " · " +
          rawsWindDirection(a.WindDirPeak) + "<br>" +
          "<strong>Rain accumulation:</strong> " +
          rawsValue(a.RainAccumulation, "") + "<br>" +
          "<strong>Elevation:</strong> " +
          rawsValue(a.Elevation, " ft") + "<br>" +
          "<strong>Observation:</strong> " +
          rawsObservationTime(a.ObservedDate);

        if (a.MesoWestURL) {
          const weatherUrl = String(a.MesoWestURL);

          if (/^https:\/\/[^\s"'<>]+$/i.test(weatherUrl)) {
            popup +=
              "<br><a href='" + escapeHtml(weatherUrl) +
              "' target='_blank' rel='noopener noreferrer'>" +
              "Detailed station weather</a>";
          }
        }

        popup += "</div>";

        marker.bindPopup(popup);
        marker.addTo(replacementLayer);
      });

      rawsLayer.clearLayers();

      replacementLayer.eachLayer(function (layer) {
        layer.addTo(rawsLayer);
      });

      console.info(
        "Active Jackson/Josephine RAWS stations loaded:",
        features.length
      );

    } catch (error) {
      console.error("Could not refresh RAWS weather stations:", error);
    } finally {
      rawsRefreshInProgress = false;
    }
  }

  updateRawsStations();
  setInterval(updateRawsStations, 15 * 60 * 1000);

  // =========================================================
  // USGS LAKES & PONDS
  //
  // featuretype = 3: Lake
  // Minimum size = 0.25 acre
  // Statewide, visible map extent at zoom 9+
  // Only fetch waterbody geometry for the current map view
  // =========================================================

  const usgsWaterbodyQueryUrl =
    "https://3dhp.nationalmap.gov/arcgis/rest/services/usgs_3dhp_all/FeatureServer/60/query";

  const oregonCountyQueryUrl =
    "https://gis.wrd.state.or.us/server/rest/services/adm/Counties_WGS84/FeatureServer/0/query";

  // 0.25 acre converted to square kilometers.
  const waterbodyMinimumAreaSqKm = 0.0010117;

  const waterbodyWhere =
    "featuretype = 3 AND areasqkm >= " +
    waterbodyMinimumAreaSqKm;

  const usgsWaterbodyLayer = L.layerGroup();

  let waterbodyRefreshSequence = 0;
  let waterbodyRefreshTimer = null;
  let waterbodyLastViewKey = "";
  let waterbodyAbortController = null;

  // formatWaterbodyAcres: format waterbody acres logic.
  function formatWaterbodyAcres(areaSqKm) {
    const squareKm = Number(areaSqKm);

    if (!Number.isFinite(squareKm) || squareKm < 0) {
      return "Not reported";
    }

    const acres = squareKm * 247.105381;

    return acres.toLocaleString(undefined, {
      maximumFractionDigits: 2
    }) + " acres";
  }

  // formatWaterbodyDate: format waterbody date logic.
  function formatWaterbodyDate(value) {
    if (value == null || value === "") return "Not reported";

    const timestamp = Number(value);

    if (!Number.isFinite(timestamp)) return "Not reported";

    const date = new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "Not reported";

    return escapeHtml(date.toLocaleDateString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric"
    }));
  }

  // waterbodyPopup: waterbody popup logic.
  function waterbodyPopup(attributes) {
    const name =
      attributes.gnisidlabel ||
      attributes.id3dhp ||
      "Unnamed lake or pond";

    const type = attributes.featuretypelabel || "Lake";

    return (
      "<div style='min-width:190px;max-width:260px;line-height:1.5'>" +
      "<strong style='font-size:15px'>" +
      escapeHtml(name) +
      "</strong><br>" +
      "<span style='color:#1769d2;font-weight:bold'>" +
      "USGS Waterbody</span><br>" +
      "<strong>Type:</strong> " +
      escapeHtml(type) + "<br>" +
      "<strong>Mapped area:</strong> " +
      escapeHtml(formatWaterbodyAcres(attributes.areasqkm)) + "<br>" +
      "<strong>Feature ID:</strong> " +
      escapeHtml(attributes.id3dhp) + "<br>" +
      "<strong>Feature date:</strong> " +
      formatWaterbodyDate(attributes.featuredate) +
      "</div>"
    );
  }

  // addWaterbodyFeature: add waterbody feature logic.
  function addWaterbodyFeature(feature, targetLayer) {
    const attributes = feature.attributes || {};
    const geometry = feature.geometry || {};
    const rings = Array.isArray(geometry.rings) ? geometry.rings : [];

    if (!rings.length) return;

    const latLngRings = rings.map(function (ring) {
      return ring.map(function (point) {
        return [Number(point[1]), Number(point[0])];
      });
    });

    if (!latLngRings[0] || latLngRings[0].length < 3) return;

    const polygon = L.polygon(latLngRings, {
      color: "#1769d2",
      weight: 1.5,
      opacity: 0.95,
      fillColor: "#42a5f5",
      fillOpacity: 0.55
    });

    polygon.bindPopup(waterbodyPopup(attributes));
    polygon.addTo(targetLayer);
  }

  // currentWaterbodyViewKey: current waterbody view key logic.
  function currentWaterbodyViewKey() {
    const bounds = map.getBounds();

    // Rounded key avoids needless requests for tiny movement differences.
    return [
      bounds.getWest().toFixed(5),
      bounds.getSouth().toFixed(5),
      bounds.getEast().toFixed(5),
      bounds.getNorth().toFixed(5),
      map.getZoom()
    ].join(",");
  }

  // updateWaterbodiesInView: update waterbodies in view logic.
  async function updateWaterbodiesInView() {
    if (!map.hasLayer(usgsWaterbodyLayer)) return;
    if (map.getZoom() < 9) {
      waterbodyRefreshSequence++;
      if (waterbodyAbortController) waterbodyAbortController.abort();
      waterbodyAbortController = null;
      waterbodyLastViewKey = "";
      usgsWaterbodyLayer.clearLayers();
      return;
    }
    const viewKey = currentWaterbodyViewKey();
    if (viewKey === waterbodyLastViewKey) return;
    const sequence = ++waterbodyRefreshSequence;
    if (waterbodyAbortController) waterbodyAbortController.abort();
    const controller = new AbortController();
    waterbodyAbortController = controller;
    const bounds = map.getBounds();
    const geometry = JSON.stringify({xmin: bounds.getWest(), ymin: bounds.getSouth(),
      xmax: bounds.getEast(), ymax: bounds.getNorth(), spatialReference: {wkid:4326}});
    const base = {
      where: waterbodyWhere, geometry, geometryType: "esriGeometryEnvelope", inSR: "4326",
      spatialRel: "esriSpatialRelIntersects",
      outFields: "OBJECTID,id3dhp,gnisidlabel,featuretype,featuretypelabel,areasqkm,featuredate",
      returnGeometry: "true", outSR: "4326", orderByFields: "OBJECTID ASC",
      resultRecordCount: "1000", f: "json"
    };
    try {
      const replacementLayer = L.layerGroup();
      const loadedIds = new Set();
      for (let offset = 0; ; offset += 1000) {
        const response = await fetch(usgsWaterbodyQueryUrl, {
          method: "POST", signal: controller.signal,
          headers: {"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
          body: new URLSearchParams({...base, resultOffset: String(offset)}).toString()
        });
        if (!response.ok) throw Error("Waterbody HTTP " + response.status);
        const data = await response.json();
        if (data.error) throw Error(data.error.message || "Waterbody query failed");
        if (sequence !== waterbodyRefreshSequence || !map.hasLayer(usgsWaterbodyLayer) || map.getZoom() < 9) return;
        const page = Array.isArray(data.features) ? data.features : [];
        page.forEach(feature => {
          const id = feature.attributes && feature.attributes.OBJECTID;
          if (id != null && loadedIds.has(id)) return;
          if (id != null) loadedIds.add(id);
          addWaterbodyFeature(feature, replacementLayer);
        });
        if (!page.length || (!data.exceededTransferLimit && page.length < 1000)) break;
      }
      usgsWaterbodyLayer.clearLayers();
      replacementLayer.eachLayer(layer => layer.addTo(usgsWaterbodyLayer));
      waterbodyLastViewKey = viewKey;
      console.info("Oregon lakes and ponds in view:", loadedIds.size);
    } catch(error) {
      if (error.name !== "AbortError") console.error("Could not load USGS waterbodies:", error);
    } finally {
      if (sequence === waterbodyRefreshSequence) waterbodyAbortController = null;
    }
  }

  // scheduleWaterbodyRefresh: schedule waterbody refresh logic.
  function scheduleWaterbodyRefresh() {
    if (!map.hasLayer(usgsWaterbodyLayer)) return;

    clearTimeout(waterbodyRefreshTimer);

    waterbodyRefreshTimer = setTimeout(function () {
      updateWaterbodiesInView();
    }, 300);
  }



  // =========================================================
  // GPS TRACK — SEPARATE SEGMENT FOR EACH GPS SESSION
  // =========================================================

  // Visible by default. Layer visibility does not control recording.
  const gpsTrackLayer = L.layerGroup().addTo(map);

  const gpsTrackStyle = {
    color: "#00a6ff",
    weight: 5,
    opacity: 0.9,
    lineCap: "round",
    lineJoin: "round"
  };

  // Persist short GPS segments locally. Storage is optional: GPS still works if blocked.
  const GPS_DB_NAME = "topotac-gps-tracks";
  const GPS_DB_STORE = "segments";
  let gpsDb = null;
  let gpsDbReady = false;
  let gpsStorageWarningShown = false;
  let gpsSegmentId = null;
  let gpsLastFixTime = 0;
  let gpsWriteQueue = Promise.resolve();
  let gpsTrackGeneration = 0;
  const GPS_GAP_MS = 60000;

  // warnGpsStorage: warn gps storage logic.
  function warnGpsStorage(err) {
    console.warn("GPS track local storage unavailable:", err);
    if (!gpsStorageWarningShown) {
      gpsStorageWarningShown = true;
      const note = document.createElement("div");
      note.textContent = "GPS tracks are temporary: browser storage unavailable.";
      note.setAttribute("role", "status");
      note.style.cssText = "position:absolute;bottom:245px;right:8px;z-index:1200;background:#fff4dd;color:#3a2500;padding:9px;border:1px solid #bd8d31;border-radius:5px;max-width:220px;font:12px Arial";
      document.body.appendChild(note);
    }
  }

  // openGpsDb: open gps db logic.
  function openGpsDb() {
    if (!window.indexedDB) { warnGpsStorage("IndexedDB unsupported"); return Promise.resolve(null); }
    return new Promise(resolve => {
      let request;
      try { request = indexedDB.open(GPS_DB_NAME, 1); }
      catch (err) { warnGpsStorage(err); resolve(null); return; }
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(GPS_DB_STORE)) db.createObjectStore(GPS_DB_STORE, {keyPath:"id"});
      };
      request.onsuccess = () => { gpsDb = request.result; gpsDbReady = true; resolve(gpsDb); };
      request.onerror = () => { warnGpsStorage(request.error); resolve(null); };
      request.onblocked = () => { warnGpsStorage("Database upgrade blocked"); resolve(null); };
    });
  }

  // gpsDbOperation: gps db operation logic.
  function gpsDbOperation(mode, action) {
    return new Promise((resolve, reject) => {
      if (!gpsDbReady || !gpsDb) { resolve(null); return; }
      try {
        const tx = gpsDb.transaction(GPS_DB_STORE, mode);
        const store = tx.objectStore(GPS_DB_STORE);
        const req = action(store);
        tx.oncomplete = () => resolve(req ? req.result : true);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      } catch(err) { reject(err); }
    });
  }

  // Restore before recording new positions, so asynchronous reads never overwrite them.
  const gpsRestorePromise = openGpsDb().then(async db => {
    if (!db) return;
    const generation = gpsTrackGeneration;
    try {
      const records = await gpsDbOperation("readonly", store => store.getAll());
      if (generation !== gpsTrackGeneration) return;
      for (const record of (records || [])) {
        if (!Array.isArray(record.points) || !record.points.length) continue;
        L.polyline(record.points, gpsTrackStyle).addTo(gpsTrackLayer);
      }
    } catch(err) { warnGpsStorage(err); }
  });

  // saveGpsSegment: save gps segment logic.
  function saveGpsSegment() {
    if (!gpsSegmentId || !gpsTrackPoints.length) return;
    const record = {id:gpsSegmentId, points:gpsTrackPoints.map(p => [p.lat,p.lng])};
    const generation = gpsTrackGeneration;
    gpsWriteQueue = gpsWriteQueue.then(async () => {
      await gpsRestorePromise;
      if (generation !== gpsTrackGeneration) return;
      await gpsDbOperation("readwrite", store => store.put(record));
    }).catch(warnGpsStorage);
  }

  // Each GPS session gets its own polyline.
  let gpsTrackLine = null;
  let gpsTrackPoints = [];

  // recordGpsTrackPoint: record gps track point logic.
  function recordGpsTrackPoint(location) {
    // Create a new line when a session starts or restarts.
    const fixTime = Date.now();
    if (gpsTrackLine && gpsLastFixTime && fixTime - gpsLastFixTime > GPS_GAP_MS) endGpsTrackSegment();
    gpsLastFixTime = fixTime;
    if (!gpsTrackLine) {
      gpsSegmentId = "segment-" + fixTime + "-" + Math.random().toString(36).slice(2);
      gpsTrackPoints = [];
      gpsTrackLine = L.polyline([], gpsTrackStyle);
      gpsTrackLine.addTo(gpsTrackLayer);
    }

    const previousPoint =
      gpsTrackPoints.length > 0
        ? gpsTrackPoints[gpsTrackPoints.length - 1]
        : null;

    // Ignore duplicate consecutive positions.
    if (
      !previousPoint ||
      previousPoint.lat !== location.lat ||
      previousPoint.lng !== location.lng
    ) {
      gpsTrackPoints.push(location);
      gpsTrackLine.setLatLngs(gpsTrackPoints);
      saveGpsSegment();
    }
  }

  // End the current segment without deleting its line.
  // endGpsTrackSegment: end gps track segment logic.
  function endGpsTrackSegment() {
    gpsTrackLine = null;
    gpsTrackPoints = [];
    gpsSegmentId = null;
    gpsLastFixTime = 0;
  }

  const clearTrackButton =
    document.getElementById("clearTrackButton");

  L.DomEvent.disableClickPropagation(clearTrackButton);
  L.DomEvent.disableScrollPropagation(clearTrackButton);

  clearTrackButton.addEventListener("click", function () {
    // Delete every segment, including earlier GPS sessions.
    gpsTrackGeneration++;
    gpsTrackLayer.clearLayers();
    gpsRecordingStart=null;
    updateGpsStats();
    gpsWriteQueue = gpsWriteQueue.then(async () => {
      await gpsRestorePromise;
      await gpsDbOperation("readwrite", store => store.clear());
    }).catch(warnGpsStorage);

    // If GPS is still on, the next position starts a fresh line.
    endGpsTrackSegment();
  });


  document.addEventListener("visibilitychange", () => {
    if (document.hidden) endGpsTrackSegment();
  });
  window.addEventListener("pagehide", endGpsTrackSegment);

  // =========================================================
  // GPX IMPORT LAYER
  // =========================================================

  // Master checkbox; its behavior is handled below.
  const gpxTrackLayer = L.layerGroup();
  const gpxOverlayLayers = [];

  const markedPointsLayer = L.layerGroup().addTo(map);

  // =========================================================
  // US AIR QUALITY — EPA AIRNOW HOURLY PM2.5 AQI CONTOURS
  // Off by default. Request only visible polygons; refresh at most hourly.
  // =========================================================
  map.createPane("aqiPane");
  map.getPane("aqiPane").style.zIndex = 450; // above map imagery, below markers
  map.getPane("aqiPane").style.pointerEvents = "none";
  const airQualityLayer = L.layerGroup();
  const AQI_SERVICE = "https://services.arcgis.com/cJ9YHowT8TU7DUyn/ArcGIS/rest/services/AirNowLatestContoursPM25/FeatureServer/0/query";
  const AQI_COLORS = [null, "#00e400", "#ffff00", "#ff7e00", "#ff0000", "#99004c", "#4c0026"];
  const AQI_NAMES = [null, "Good", "Moderate", "Unhealthy for sensitive groups", "Unhealthy", "Very unhealthy", "Hazardous"];
  let aqiController = null;
  let aqiRequestId = 0;
  let aqiLastView = "";
  let aqiLastFetch = 0;
  let aqiRefreshTimer = null;

  async function updateAirQuality(force = false) {
    if (!map.hasLayer(airQualityLayer)) return;
    const bounds = map.getBounds();
    const box = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()];
    const viewKey = box.map(n => n.toFixed(2)).join(",");
    if (!force && aqiLastView === viewKey && Date.now() - aqiLastFetch < 55 * 60 * 1000) return;
    if (aqiController) aqiController.abort();
    const controller = new AbortController();
    aqiController = controller;
    const requestId = ++aqiRequestId;
    const params = new URLSearchParams({
      f: "geojson", where: "1=1", outFields: "gridcode,Timestamp",
      geometry: box.join(","), geometryType: "esriGeometryEnvelope",
      inSR: "4326", outSR: "4326", spatialRel: "esriSpatialRelIntersects",
      // Reduce geometry payload, particularly when zoomed out.
      maxAllowableOffset: String(Math.max(0.005, 0.25 / Math.pow(2, Math.max(0, map.getZoom() - 6)))),
      geometryPrecision: "4", returnGeometry: "true"
    });
    try {
      const response = await fetch(AQI_SERVICE + "?" + params, {signal: controller.signal});
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      if (data.error || data.type !== "FeatureCollection") throw new Error(data.error?.message || "Invalid GeoJSON");
      if (requestId !== aqiRequestId || !map.hasLayer(airQualityLayer)) return;
      const polygons = L.geoJSON(data, {
        pane: "aqiPane",
        interactive: false,
        style: feature => ({
          color: "transparent", weight: 0,
          fillColor: AQI_COLORS[Number(feature.properties?.gridcode)] || "#888888",
          fillOpacity: 0.40
        })
      });
      airQualityLayer.clearLayers();
      airQualityLayer.addLayer(polygons);
      aqiLastView = viewKey;
      aqiLastFetch = Date.now();
    } catch (error) {
      if (error.name !== "AbortError") console.warn("AirNow AQI overlay unavailable:", error);
    } finally {
      if (aqiController === controller) aqiController = null;
    }
  }
  // Poll hourly while enabled; movement loads the new viewport on demand.
  aqiRefreshTimer = setInterval(() => updateAirQuality(true), 60 * 60 * 1000);

  // =========================================================
  // LAYER MENU
  // =========================================================

  // ODF official statewide roads and labels. The selected layer draws only at zoom 12–19.
  map.createPane('odfRoadsTop');
  map.getPane('odfRoadsTop').style.zIndex='650';
  map.getPane('odfRoadsTop').style.pointerEvents='none';
  const odfRoads = L.gridLayer({pane:'odfRoadsTop',tileSize:256,maxZoom:19,opacity:1,updateWhenIdle:true});
  odfRoads.createTile=function(coords,done){
    if(coords.z<12){
      const blank=document.createElement('div');
      blank.style.width='256px';blank.style.height='256px';
      done(null,blank);
      return blank;
    }
    const tile=document.createElement('img');tile.alt='';tile.width=256;tile.height=256;
    const nw=map.unproject(L.point(coords.x*256,coords.y*256),coords.z);
    const se=map.unproject(L.point((coords.x+1)*256,(coords.y+1)*256),coords.z);
    const a=L.CRS.EPSG3857.project(nw),b=L.CRS.EPSG3857.project(se);
    const bbox=[a.x,b.y,b.x,a.y].join(',');
    const params=new URLSearchParams({bbox,bboxSR:'3857',imageSR:'3857',size:'256,256',format:'png32',transparent:'true',layers:'show:2,3',f:'image'});
    tile.onload=()=>done(null,tile);tile.onerror=()=>done(new Error('ODF road tile unavailable'),tile);
    tile.src='https://gis.odf.oregon.gov/ags1/rest/services/WebMercator/Transportation/MapServer/export?'+params;
    return tile;
  };
  // Keep the layer selectable at every zoom, but never show cached road tiles below 12.
  // Hiding the dedicated pane also covers tiles retained during Leaflet zoom animations.
  function syncOdfRoadVisibility(){
    map.getPane('odfRoadsTop').style.display = map.getZoom() >= 12 ? '' : 'none';
  }
  map.on('zoom', syncOdfRoadVisibility);
  map.on('zoomend', syncOdfRoadVisibility);
  syncOdfRoadVisibility();

  // Search result is session-only: replace on successful searches, clear on reload.
  map.createPane('addressResultPane');
  map.getPane('addressResultPane').style.zIndex = '675';
  map.getPane('addressResultPane').style.pointerEvents = 'none';
  const addressResultIcon = L.divIcon({
    className: 'address-result-icon',
    html: '<span class="address-target" aria-hidden="true"><span class="address-target-center"></span></span>',

  function showAddressResult(hit,query){
    const lat=hit.location.y,lon=hit.location.x;
    const matchType=hit.attributes?.Addr_type||'Unknown';
    const popup=document.createElement('div');
    const title=document.createElement('strong');title.textContent='Esri address result';
    const address=document.createElement('div');address.textContent=hit.address||query;
    const detail=document.createElement('div');detail.textContent=`Match: ${matchType} · Score: ${Math.round(hit.score)}/100`;
    const coords=document.createElement('div');coords.textContent=`DDM: ${toDDM(lat)}, ${toDDM(lon)}`;
    const caution=document.createElement('small');caution.textContent='Verify location before operational use; geocoded positions are not surveyed property points.';
    popup.append(title,address,detail,coords,caution);
    if(addressResultMarker)map.removeLayer(addressResultMarker);
    addressResultMarker=L.marker([lat,lon],{icon:addressResultIcon,pane:'addressResultPane',keyboard:true})
      .bindPopup(popup).addTo(map);
    map.setView([lat,lon],17);
    addressResultMarker.openPopup();
    clearAddressChoices();addressPanel.hidden=true;
  }
  addressForm.addEventListener('submit',async e=>{
    e.preventDefault();
    const query=addressInput.value.trim();if(!query)return;
    const go=document.getElementById('addressSearchGo');
    go.disabled=true;clearAddressChoices();addressStatus.textContent='Searching Esri…';
    try {
      // Country filter only: users can search in any US state, regardless of map location.
      const params=new URLSearchParams({
        f:'json',singleLine:query,sourceCountry:'USA',
        outFields:'Match_addr,Addr_type,Region,City,Score',maxLocations:'10'
      });
      const response=await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?'+params);
      if(!response.ok)throw new Error('Esri service unavailable (HTTP '+response.status+').');
      const data=await response.json();
      if(data.error)throw new Error('Esri: '+(data.error.message||'Geocoding request failed'));
      const candidates=(data.candidates||[]).filter(c=>Number.isFinite(c.location?.x)&&Number.isFinite(c.location?.y)&&c.score>=85);
      if(!candidates.length){addressStatus.textContent='No reliable address match found. Include the house number, street, city, state and ZIP code.';return;}
      // Close-scoring alternatives may be in different states. Let the user choose rather than guessing.
      const close=candidates.filter(c=>c.score>=candidates[0].score-5);
      if(close.length===1){showAddressResult(candidates[0],query);return;}
      addressStatus.textContent='Several possible matches. Select the correct address:';
      for(const candidate of close){
        const option=document.createElement('button');option.type='button';
        option.style.cssText='text-align:left;padding:8px;border:1px solid #aaa;border-radius:5px;background:#fff;color:#111;cursor:pointer;';
        option.textContent=`${candidate.address} (${Math.round(candidate.score)}/100)`;
        option.addEventListener('click',()=>showAddressResult(candidate,query));
        addressChoices.appendChild(option);
      }
    }catch(err){addressStatus.textContent=err.message||'Search failed. Check internet connection.';}
    finally{go.disabled=false;}
  });

  // =========================================================
  // GPX IMPORT — local files, rendered as a separate map layer

  const gpxFileInput = document.getElementById("gpxFileInput");
  const gpxImportButton = document.getElementById("gpxImportButton");
  const clearGpxButton = document.getElementById("clearGpxButton");
  const gpxStatus = document.getElementById("gpxStatus");
  let gpxTrackCount = 0;
  const gpxColors = [
    "#7b2cbf", "#0077b6", "#d97706", "#008148",
    "#c1121f", "#5a189a", "#0f766e", "#c026d3"
  ];

  // showGpxStatus: show gpx status logic.
  function showGpxStatus(message, show) {
    gpxStatus.textContent = message;
    gpxStatus.style.display = show === false ? "none" : "block";
  }

  // gpxText: gpx text logic.
  function gpxText(node, tagName) {
    const child = node.getElementsByTagName(tagName)[0];
    return child ? child.textContent.trim() : "";
  }

  // gpxPointFromNode: gpx point from node logic.
  function gpxPointFromNode(node) {
    const lat = Number(node.getAttribute("lat"));
    const lon = Number(node.getAttribute("lon"));
    if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
        lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      return null;
    }
    return L.latLng(lat, lon);
  }

  // gpxDistanceMeters: gpx distance meters logic.
  function gpxDistanceMeters(points) {
    let distance = 0;
    for (let i = 1; i < points.length; i++) {
      distance += points[i - 1].distanceTo(points[i]);
    }
    return distance;
  }

  // formatGpxDistance: format gpx distance logic.
  function formatGpxDistance(meters) {
    const miles = meters / 1609.344;
    if (miles < 0.1) return Math.round(meters) + " m";
    return miles.toFixed(2) + " mi";
  }

  // makeGpxEndpointIcon: make gpx endpoint icon logic.
  function makeGpxEndpointIcon(kind) {
    return L.divIcon({
      className: "",
      html: '<div class="gpx-' + kind + '-marker"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
  }

  // addGpxFile: add gpx file logic.
  async function addGpxFile(file) {
    const text = await file.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "application/xml");

    if (xml.getElementsByTagName("parsererror").length) {
      throw new Error("That file is not valid GPX/XML.");
    }
    const root = xml.documentElement;
    if (!root || root.localName.toLowerCase() !== "gpx") {
      throw new Error("That file does not appear to be a GPX file.");
    }

    const fileName = file.name || "Imported GPX";
    const trackName = gpxText(xml, "name") ||
      fileName.replace(/\.gpx$/i, "");
    const color = gpxColors[gpxTrackCount % gpxColors.length];
    const thisFileLayer = L.layerGroup();
    const allPoints = [];
    let lineCount = 0;

    // Keep separate track segments separate; don't draw across gaps.
    Array.from(xml.getElementsByTagName("trkseg")).forEach(function (segment) {
      const points = Array.from(segment.getElementsByTagName("trkpt"))
        .map(gpxPointFromNode).filter(Boolean);
      if (points.length < 2) return;

      L.polyline(points, {
        color: color, weight: 4, opacity: 0.9,
        lineCap: "round", lineJoin: "round"
      }).addTo(thisFileLayer);

      allPoints.push.apply(allPoints, points);
      lineCount++;
    });

    // Also support GPX route files that use rtept instead of trkpt.
    if (lineCount === 0) {
      Array.from(xml.getElementsByTagName("rte")).forEach(function (route) {
        const points = Array.from(route.getElementsByTagName("rtept"))
          .map(gpxPointFromNode).filter(Boolean);
        if (points.length < 2) return;

        L.polyline(points, {
          color: color, weight: 4, opacity: 0.9,
          lineCap: "round", lineJoin: "round", dashArray: "7 5"
        }).addTo(thisFileLayer);

        allPoints.push.apply(allPoints, points);
        lineCount++;
      });
    }

    // Add named waypoints if the GPX contains them.
    Array.from(xml.getElementsByTagName("wpt")).forEach(function (node) {
      const point = gpxPointFromNode(node);
      if (!point) return;
      const name = gpxText(node, "name") || "Waypoint";
      L.marker(point).bindPopup(
        "<strong>" + escapeHtml(name) + "</strong><br>GPX waypoint"
      ).addTo(thisFileLayer);
    });

    if (!allPoints.length) {
      throw new Error("No usable track or route points were found in " + fileName + ".");
    }

    const firstPoint = allPoints[0];
    const lastPoint = allPoints[allPoints.length - 1];
    L.marker(firstPoint, { icon: makeGpxEndpointIcon("start") })
      .bindPopup("<strong>Start</strong><br>" + escapeHtml(trackName))
      .addTo(thisFileLayer);
    L.marker(lastPoint, { icon: makeGpxEndpointIcon("end") })
      .bindPopup("<strong>End</strong><br>" + escapeHtml(trackName))
      .addTo(thisFileLayer);

    const distance = gpxDistanceMeters(allPoints);
   // Display this imported file immediately and track it
   // separately so its own checkbox works independently.
   thisFileLayer.addTo(map);
   gpxOverlayLayers.push(thisFileLayer);
   gpxTrackCount++;

    layerControl.addOverlay(
      thisFileLayer,
      escapeHtml(trackName) + " (" + formatGpxDistance(distance) + ")"
    );

    const bounds = L.latLngBounds(allPoints);
    if (bounds.isValid()) map.fitBounds(bounds.pad(0.08), { maxZoom: 16 });

    return trackName + ": " + allPoints.length + " points, " +
      formatGpxDistance(distance);
  }

  gpxImportButton.addEventListener("click", function () {

  gpxFileInput.addEventListener("change", async function () {

clearGpxButton.addEventListener("click", function () {

});

  // =========================================================

  // =========================================================
  // COORDINATES — DEGREES AND DECIMAL MINUTES ONLY
  // Negative values indicate south or west.
  // =========================================================

  // toDDM: to ddm logic.
  function toDDM(value) {
    const sign = value < 0 ? "-" : "";
    const absolute = Math.abs(value);
    const degrees = Math.floor(absolute);
    const minutes = (absolute - degrees) * 60;

    return sign + degrees + "° " + minutes.toFixed(3) + "'";
  }

  const coordinatesDisplay =
    document.getElementById("coordinates");

         event.originalEvent.target.closest(".leaflet-popup"))) return;
    coordinatesDisplay.textContent =
      toDDM(event.latlng.lat) + "  " +

    if (measureActive || lineDrawingActive) return;
    if (pointPlacementActive) {
