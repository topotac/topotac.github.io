const API='https://fire.data.nesdis.noaa.gov/api/ogc/detections/collections/ngfs_schema.ngfs_detections_scene_west_conus/items';
const $=id=>document.getElementById(id);
const map=L.map('map').setView([44,-120.5],7);
const street=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri'});
const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxNativeZoom:17,attribution:'© OpenStreetMap contributors, SRTM | OpenTopoMap'});
const aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri'});
street.addTo(map);L.control.layers({'Street Map':street,'Topo Map':topo,'Aerial Imagery':aerial}).addTo(map);
let records=[],mode='none',loadedAt=0,busy=false;
const layer=L.geoJSON(null,{style:{color:'#ff7900',weight:3,fillColor:'#ff7900',fillOpacity:.23},onEachFeature:(f,l)=>l.bindPopup(()=>popup(f),{maxWidth:380})}).addTo(map);
const esc=v=>String(v??'Not reported').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=f=>Date.parse(f.properties.pixel_date_time);
const fuels={1:'Short grass',2:'Timber with grass understory',3:'Tall grass',4:'Chaparral',5:'Brush',6:'Dormant brush',7:'Southern rough',8:'Closed timber litter',9:'Hardwood / long-needle litter',10:'Timber litter and understory',11:'Light logging slash',12:'Medium logging slash',13:'Heavy logging slash'};
function breakdown(s){return String(s??'Not reported').split(',').map(x=>{let [k,v]=x.split(':');let m=k.match(/^FBFM(\d+)$/);return esc(m?'FM'+m[1]+' – '+(fuels[m[1]]||'Unknown'):k)+(v!==undefined?' '+esc(v)+'%':'')}).join('<br>')}
function popup(f){let p=f.properties;let history=new Map();for(const r of records){let q=r.properties;if(p.feature_tracking_id&&q.feature_tracking_id===p.feature_tracking_id&&q.feature_frp!=null)history.set(q.acq_date_time,q.feature_frp)}
let h=[...history].sort((a,b)=>Date.parse(a[0])-Date.parse(b[0]));let max=Math.max(1,...h.map(x=>Number(x[1])));let graph=h.map(([t,v])=>'<div>'+esc(new Date(t).toLocaleTimeString())+' · '+esc(v)+' MW<div style="background:#ff7900;height:6px;width:'+Math.max(0,Math.min(100,100*Number(v)/max))+'%"></div></div>').join('');
let rows=[['Observed (local)',new Date(p.pixel_date_time).toLocaleString()],['Observed (UTC)',p.pixel_date_time],['Age (minutes)',Math.round((Date.now()-time(f))/60000)],['County',p.county],['Satellite',p.satellite],['Confidence',p.confidence],['Known incident',p.known_incident_name],['Pixel FRP (MW)',p.frp],['Feature FRP (MW)',p.feature_frp],['Pixel area (km²)',p.pixel_area],['Tracking ID',p.feature_tracking_id],['Coordinates',p.latitude+', '+p.longitude]];
return '<b>'+esc(p.type_description)+'</b><br>'+esc(mode==='sample'?'SAVED SAMPLE — NOT LIVE':'Satellite detection — not confirmed fire')+'<table>'+rows.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>').join('')+'</table><b>Land cover</b><br>'+breakdown(p.land_cover)+'<br><b>Fuel models</b><br>'+breakdown(p.fuel)+'<br><small>'+esc(p.fuel_source)+'</small><hr><b>Feature FRP history (returned scans)</b>'+graph+'<details><summary>All attributes</summary><pre>'+esc(JSON.stringify(p,null,2))+'</pre></details>'}
function log(s){$('log').textContent=new Date().toLocaleTimeString()+' '+s+'\n'+$('log').textContent.slice(0,14000)}
function render(){let cutoff=(mode==='sample'?Math.max(...records.map(time)):Date.now())-Number($('hours').value)*3600000;let filtered=records.filter(f=>time(f)>=cutoff&&(!$('wild').checked||f.properties.type_description==='Possible Wildland Fire')&&(!$('oregon').checked||f.properties.state==='OR'));let unique=new Map();for(let f of filtered.sort((a,b)=>time(b)-time(a))){let k=JSON.stringify(f.geometry);if(!unique.has(k))unique.set(k,f)}layer.clearLayers();layer.addData([...unique.values()]);$('status').textContent=(mode==='sample'?'SAVED SAMPLE — NOT LIVE':mode==='live'?'LIVE RESPONSE · '+new Date(loadedAt).toLocaleTimeString():'NO DATA')+' | '+records.length+' records | '+unique.size+' displayed footprints';$('raw').textContent=JSON.stringify(records,null,2)}
async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;log('Requesting NOAA GeoJSON…');let u=new URL(API);u.search=new URLSearchParams({bbox:'-124.7,41.9,-116.4,46.4',limit:'1000',f:'json',datetime:new Date(Date.now()-Number($('hours').value)*3600000).toISOString()+'/'+new Date().toISOString()});let all=[],seen=new Set(),start=performance.now();try{while(u){if(seen.has(u.href)||seen.size>=30)throw Error('Pagination loop or page limit');seen.add(u.href);let response=await fetch(u,{signal:AbortSignal.timeout(25000),cache:'no-store'});log('HTTP '+response.status+' · '+u.href);if(!response.ok)throw Error('HTTP '+response.status);let j=await response.json();if(j.type!=='FeatureCollection'||!Array.isArray(j.features))throw Error('Not a GeoJSON FeatureCollection');all.push(...j.features);let next=j.links?.find(l=>l.rel==='next');if(!next&&Number(j.numberMatched)>all.length)throw Error('Incomplete response: '+all.length+' of '+j.numberMatched);u=next?new URL(next.href,response.url):null}records=all;mode='live';loadedAt=Date.now();render();log('PASS: '+all.length+' records in '+Math.round(performance.now()-start)+' ms');}catch(e){log('FAIL: '+e.message+' (check browser network console for CORS; time filter support unverified)');$('status').textContent='LIVE REQUEST FAILED — '+(mode==='none'?'no data loaded':'retaining previous '+mode+' data; NOT refreshed');}finally{busy=false;$('refresh').disabled=false}}
$('refresh').onclick=refresh;$('sample').onclick=()=>{if(busy)return;records=SAMPLE.features;mode='sample';render();log('Loaded embedded NOAA snapshot, not live. History relative to latest sample.');if(layer.getBounds().isValid())map.fitBounds(layer.getBounds(),{maxZoom:11})};$('zoom').onclick=()=>{if(layer.getBounds().isValid())map.fitBounds(layer.getBounds(),{maxZoom:12})};$('hours').onchange=()=>mode==='sample'?render():refresh();$('wild').onchange=$('oregon').onchange=render;setInterval(()=>{if($('auto').checked&&mode!=='sample')refresh()},300000);refresh();
